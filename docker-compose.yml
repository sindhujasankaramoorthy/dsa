version: '3.8'

services:
  freshgrade-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freshgrade_app
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=freshgrade_db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      - mongodb
    restart: unless-stopped
    volumes:
      - freshgrade_data:/app/data

  mongodb:
    image: mongo:6.0
    container_name: freshgrade_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
  freshgrade_data:
